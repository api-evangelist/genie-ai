aid: genie-ai
name: Genie AI
description: 'Genie AI is a legal-AI platform that helps business and legal teams draft,
  review, edit, and negotiate contracts autonomously. Founded in 2017 by founders trained
  by Google DeepMind, Genie is built on a patent-pending architecture called Eidetic
  Intelligence that gives its agents effectively unlimited memory across documents,
  negotiations, and organizational knowledge to reduce hallucination. The product ships
  autonomous contract drafting and review, multi-document deal management, risk analysis
  against organizational playbooks, tracked-changes negotiation, template automation, and
  one of the world''s largest open legal libraries (500+ customizable templates and thousands
  of clauses across 150+ jurisdictions). Genie exposes an API and MCP connectors plus native
  integrations with email, CRM, cloud storage, and eSign on its Enterprise tier. The company
  is ISO 27001 and SOC 2 Type 2 certified, does not train on customer data, and raised a
  Series A led by GV (Google Ventures) with Khosla Ventures.'
